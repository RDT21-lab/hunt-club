<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;width:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:background .6s ease}

:root{
  --bg:#0b0a0c; --panel:#16131680; --line:#2c262b; --ink:#ece5dc; --dim:#9a8f88;
  --accent:#b5432f; --accent2:#c9a24a; --ok:#6f8f5e; --bad:#a33a33;
  --display:'Cinzel',Georgia,serif; --serif:'Cormorant Garamond',Georgia,serif;
}
body[data-pack="villa"]{--bg:#0d0907;--panel:#1a120d80;--line:#3a2a1d;--ink:#efe4d2;--dim:#a8927a;--accent:#b5432f;--accent2:#c9a24a}
body[data-pack="casa"]{--bg:#0a0b0d;--panel:#12151a80;--line:#252c33;--ink:#dfe4e8;--dim:#8794a0;--accent:#7a3b52;--accent2:#b08d57}

/* ============ PANTALLA DE ARRANQUE ============ */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:radial-gradient(70% 55% at 50% 42%,#15131c 0%,#0b0a0c 62%,#060507 100%);
  transition:opacity .55s ease,visibility .55s}
#splash.out{opacity:0;visibility:hidden}
.splashwrap{text-align:center;transform:translateY(-6%)}
.emblem{width:190px;height:190px;position:relative;margin:0 auto 26px;
  animation:emIn 1.1s cubic-bezier(.2,.9,.25,1) both}
.emblem img{width:100%;height:100%;display:block;
  clip-path:circle(41.5% at 49.2% 50%);
  filter:drop-shadow(0 0 26px rgba(201,162,74,.28)) drop-shadow(0 14px 34px rgba(0,0,0,.6))}
.emblem::after{content:'';position:absolute;inset:7.5%;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(201,162,74,.35),0 0 60px rgba(201,162,74,.12)}
@keyframes emIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.splashwrap h1{font-family:var(--display);font-weight:600;font-size:27px;color:#e8dcc4;
  letter-spacing:.42em;margin-left:.42em;animation:tIn .9s .28s cubic-bezier(.2,.9,.25,1) both}
.splashwrap .stag{font-family:var(--serif);font-style:italic;font-size:15px;color:#8d8279;margin-top:9px;
  animation:tIn .9s .46s cubic-bezier(.2,.9,.25,1) both}
@keyframes tIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.splashwrap .rule{width:46px;height:1px;background:linear-gradient(90deg,transparent,#c9a24a80,transparent);
  margin:16px auto 0;animation:tIn .9s .6s both}

/* ============ ARMAZÓN ============ */
#app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;overflow:hidden}
#app::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 80% at 50% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 60%)}

#top{flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
  display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);position:relative;z-index:2}
#top .ttl{font-family:var(--display);font-size:12px;letter-spacing:.15em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.pill{font-size:11px;letter-spacing:.09em;padding:6px 10px;border:1px solid var(--line);border-radius:999px;
  color:var(--dim);white-space:nowrap;background:var(--panel)}
.pill b{color:var(--accent2);font-weight:600}
.pill.low b{color:var(--bad)}
.pill.act{border-color:color-mix(in srgb,var(--accent) 60%,transparent);color:var(--ink);
  font-family:var(--display);letter-spacing:.14em;font-size:10.5px;cursor:pointer}
.pill.act:active{background:color-mix(in srgb,var(--accent) 24%,transparent)}
#topL:empty{display:none}
.iconbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);font-size:19px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0 2px 2px 0}
.iconbtn:active{background:#ffffff12;color:var(--ink)}

#screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:16px 16px 46px;position:relative;z-index:1;overscroll-behavior:contain}
h2.sec{font-family:var(--display);font-size:10.5px;letter-spacing:.28em;color:var(--dim);margin:0 0 12px}
p.lead{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--dim);margin-bottom:16px}

/* ============ NAVEGACIÓN 3 PESTAÑAS CON CENTRO CIRCULAR ============ */
#nav{flex:0 0 auto;position:relative;z-index:3;display:flex;align-items:stretch;
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px)}
#nav button{flex:1;background:none;border:none;color:var(--dim);cursor:pointer;padding:12px 2px 13px;
  font-family:'Inter',sans-serif;font-size:9.5px;letter-spacing:.13em;
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:color .25s;position:relative}
#nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--accent2)}
#nav .dot{position:absolute;top:7px;right:calc(50% - 17px);width:6px;height:6px;border-radius:50%;background:var(--accent)}
/* botón central elevado */
#nav button.hub{flex:0 0 96px;padding-top:0;gap:6px;justify-content:flex-end;padding-bottom:13px}
#nav button.hub .disc{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
  margin-top:-27px;background:linear-gradient(160deg,#1e1a19,#100e0f);
  border:1px solid color-mix(in srgb,var(--accent2) 42%,transparent);
  box-shadow:0 0 0 5px var(--bg),0 8px 22px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .25s,border-color .25s,box-shadow .25s}
#nav button.hub svg{width:25px;height:25px;stroke-width:1.4}
#nav button.hub.on .disc{border-color:var(--accent2);
  box-shadow:0 0 0 5px var(--bg),0 0 26px color-mix(in srgb,var(--accent2) 34%,transparent),inset 0 1px 0 rgba(255,255,255,.08)}
#nav button.hub:active .disc{transform:scale(.94)}
#nav button.hub .disc svg{color:var(--accent2)}

/* ============ TARJETAS DE AMBIENTE ============ */
.scard{position:relative;height:150px;border-radius:16px;overflow:hidden;margin-bottom:11px;
  border:1px solid var(--line);cursor:pointer;transition:border-color .3s,transform .18s;isolation:isolate}
.scard:active{transform:scale(.988)}
.scard .scene{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;display:block}
.scard .scrim{position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,#0000 0%,#0000 26%,#000a 66%,#000e 100%)}
.scard .lab{position:absolute;left:15px;right:15px;bottom:13px;z-index:3}
.scard .lab .n{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.1em;
  color:#fff;text-shadow:0 2px 10px #000c}
.scard .lab .s{font-family:var(--serif);font-style:italic;font-size:13.5px;color:#d9cfc4;
  margin-top:3px;text-shadow:0 1px 8px #000c}
.scard.on{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2),0 8px 26px #0007}

.scard .mark{position:absolute;top:11px;right:12px;z-index:3;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;background:var(--accent2);color:#1a1207;font-size:13px;font-weight:700;
  opacity:0;transform:scale(.6);transition:.25s}
.scard.on .mark{opacity:1;transform:scale(1)}
.scard.soon{cursor:default}
.scard.soon .scrim{background:linear-gradient(180deg,#0005,#0008 58%,#000b)}
.scard.soon .scene{filter:grayscale(.45) brightness(.58)}
.scard.soon .lab .n{color:#9d948c}
.scard .soonbadge{position:absolute;top:11px;right:12px;z-index:3;font-size:9px;letter-spacing:.16em;
  font-family:var(--display);color:var(--dim);border:1px solid var(--line);border-radius:999px;
  padding:4px 9px;background:#0009}

/* ============ PLANO ============ */
#plan{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--line);
  border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:13px}
.rm{position:relative;aspect-ratio:1;overflow:hidden;background:#07060a;cursor:pointer}
.rm .fx{position:absolute;inset:0;background-size:300% 300%;background-repeat:no-repeat;
  filter:brightness(.34) saturate(.52);transition:filter .5s ease}
.rm.done .fx{filter:brightness(1.04) saturate(1.04)}
.rm.body .fx{filter:brightness(.42) saturate(.55) sepia(.3) hue-rotate(-20deg)}
.rm.body.done .fx{filter:brightness(1.04) saturate(1.04)}
.rm:active .fx{filter:brightness(1.15) saturate(1.1)}
.rm.body::after{content:'';position:absolute;inset:0;border:2px solid var(--accent);pointer-events:none}
.rm.done::after{content:'';position:absolute;inset:0;border:1.5px solid color-mix(in srgb,var(--accent2) 60%,transparent);pointer-events:none}
.rm.body.done::after{border-color:var(--accent);border-width:2px}
.rm .lab{position:absolute;left:0;right:0;bottom:0;padding:9px 4px 5px;text-align:center;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.72) 42%,rgba(0,0,0,.9))}
.rm .ln{font-size:9.5px;font-weight:600;color:#fff;line-height:1.1;text-shadow:0 1px 4px #000}
.rm .lm{font-size:7.5px;color:#c9beb4;margin-top:1.5px;line-height:1.1}
.rm .mk,.rm .ck{position:absolute;top:4px;font-size:11px;font-weight:700;line-height:1;text-shadow:0 1px 4px #000;z-index:2}
.rm .mk{left:5px;color:var(--accent)}
.rm .ck{right:5px;color:var(--accent2)}

/* ============ TARJETAS / PISTAS ============ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;
  backdrop-filter:blur(8px);position:relative}
.card.tap{cursor:pointer}
.card.tap:active{border-color:color-mix(in srgb,var(--accent2) 50%,transparent)}
.row{display:flex;align-items:center;gap:12px}
.av{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-size:15px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--ink)}
.nm{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.15}
.rl{font-size:11.5px;color:var(--dim);letter-spacing:.02em;margin-top:2px}
.tag{display:inline-block;font-size:10px;letter-spacing:.1em;padding:3px 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--dim);margin-top:8px;margin-right:5px}
.tag.cleared{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.tag.lie{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.tag.open{color:var(--accent2);border-color:color-mix(in srgb,var(--accent2) 40%,transparent)}
.claim{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink);margin-top:10px;
  padding-left:11px;border-left:2px solid color-mix(in srgb,var(--accent2) 40%,transparent);line-height:1.4}
.clue{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin-bottom:14px}
.clue .src{font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:4px}
.clue .txt{font-family:var(--serif);font-size:16.5px;line-height:1.45}
.clue.obj{border-left-color:color-mix(in srgb,var(--accent2) 55%,transparent)}
.clue.hard{border-left-color:color-mix(in srgb,var(--ok) 55%,transparent)}

/* ============ CONTROLES ============ */
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-family:var(--display);font-size:12px;letter-spacing:.2em;
  margin-top:10px;cursor:pointer;transition:.2s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{color:var(--dim)}
.btn:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.opt{padding:12px 10px;border:1px solid var(--line);border-radius:11px;text-align:center;
  font-size:13px;line-height:1.3;cursor:pointer;transition:.2s;background:var(--panel)}
.opt.on{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,transparent)}
.opt small{display:block;color:var(--dim);font-size:10.5px;margin-top:3px}
.chips{display:flex;gap:7px;margin-bottom:6px}
.nums{display:flex;gap:6px;flex-wrap:wrap}
.num{flex:1 0 34px;max-width:46px;aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);
  border-radius:10px;font-family:var(--display);font-size:15px;color:var(--dim);cursor:pointer;transition:.2s}
.num.on{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--ink)}
.num:active{transform:scale(.93)}
.chip{flex:1;padding:11px 6px;border:1px solid var(--line);border-radius:11px;text-align:center;
  background:var(--panel);cursor:pointer;transition:.2s}
.chip .cn{font-size:12.5px;font-weight:500}
.chip .cs{display:block;color:var(--dim);font-size:10px;margin-top:3px}
.chip.on{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,transparent)}
.seedrow{display:flex;gap:8px;align-items:stretch;margin-bottom:7px}
.code{font-family:var(--display);font-size:20px;letter-spacing:.3em;text-align:center;color:var(--accent2);
  padding:14px;border:1px dashed var(--line);border-radius:12px;background:var(--panel)}
input.code{flex:1;min-width:0;background:var(--panel);border:1px dashed var(--line);
  text-transform:uppercase;outline:none;-webkit-user-select:text;user-select:text}
.reroll{flex:0 0 52px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
  color:var(--accent2);font-size:20px;cursor:pointer}
.reroll:active{transform:scale(.94)}
.note{font-size:11.5px;color:var(--dim);line-height:1.5;text-align:center}

/* ============ ARCHIVO / CLUB ============ */
.stat3{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:23px;color:var(--accent2);line-height:1}
.stat span{display:block;font-size:10px;letter-spacing:.11em;color:var(--dim);margin-top:6px}
.rank{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px;
  position:relative;overflow:hidden}
.rank::before{content:'';position:absolute;inset:0;
  background:radial-gradient(90% 130% at 100% 0,color-mix(in srgb,var(--accent2) 15%,transparent),transparent 62%)}
.rank .rn{font-family:var(--display);font-size:20px;letter-spacing:.14em;position:relative}
.rank .rd{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--dim);margin-top:5px;position:relative}
.bar{height:5px;border-radius:99px;background:#ffffff12;margin-top:14px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .7s cubic-bezier(.2,.9,.25,1)}
.meds{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.med{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;opacity:.42;transition:.35s}
.med.got{opacity:1;border-color:color-mix(in srgb,var(--accent2) 42%,transparent)}
.med .mi{font-size:19px;letter-spacing:.14em;line-height:1;margin-bottom:7px}
.med .mn{font-size:12px;font-weight:600;line-height:1.25}
.med .md{font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.35}
.logrow{display:flex;align-items:center;gap:12px;padding:12px 13px;border:1px solid var(--line);
  border-radius:13px;background:var(--panel);margin-bottom:8px;cursor:pointer}
.logrow:active{border-color:color-mix(in srgb,var(--accent2) 45%,transparent)}
.logrow .vd{flex:0 0 auto;width:9px;height:9px;border-radius:50%}
.logrow .vd.win{background:var(--ok);box-shadow:0 0 10px color-mix(in srgb,var(--ok) 60%,transparent)}
.logrow .vd.lose{background:var(--bad)}
.logrow .vd.ab{background:var(--dim);opacity:.55}
.logrow .lc{font-family:var(--display);font-size:13px;letter-spacing:.17em;color:var(--ink)}
.logrow .lm{font-size:11px;color:var(--dim);margin-top:3px}
.logrow .lr{margin-left:auto;text-align:right;font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.empty{text-align:center;padding:34px 18px;color:var(--dim)}
.empty .ei{font-size:31px;opacity:.4;margin-bottom:12px}
.empty .et{font-family:var(--serif);font-style:italic;font-size:16.5px;line-height:1.5}

/* ============ HOJA MODAL ============ */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .bd{position:absolute;inset:0;background:#000b;backdrop-filter:blur(3px)}
#modal .sheet{position:relative;width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;
  background:var(--bg);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;
  padding:22px 18px calc(env(safe-area-inset-bottom) + 20px);
  animation:up .32s cubic-bezier(.2,.8,.3,1);overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
#modal h3{font-family:var(--display);font-size:15px;letter-spacing:.14em;margin-bottom:14px}

/* ============ HERO / FINAL ============ */
.hero{text-align:center;padding:14px 0 18px}
.hero h1{font-family:var(--display);font-size:29px;letter-spacing:.26em;margin-bottom:9px;margin-left:.26em}
.hero .sub{font-family:var(--serif);font-style:italic;font-size:16.5px;color:var(--dim)}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:20px 0}
.verdict{font-family:var(--display);font-size:24px;letter-spacing:.2em;text-align:center;margin-bottom:6px}
.verdict.win{color:var(--ok)} .verdict.lose{color:var(--bad)}
</style>
</head>

const DIFS={
 facil :{id:'facil', n:'Indicios claros', acc:16, liars:2, desc:'2 mienten · 16 acciones'},
 normal:{id:'normal',n:'Noche cerrada',  acc:15, liars:3, desc:'3 mienten · 15 acciones'},

/* ============================================================
   GENERADOR
   ============================================================ */
let CID=0;
function mk(txt,src,facts,extra){return Object.assign({id:++CID,txt,src,facts:facts||[]},extra||{})}

function build(P,dif,r){
  const nine=[0,1,2,3,4,5,6,7,8];
  const culprit=Math.floor(r()*6);
  const crimeRoom=Math.floor(r()*9);
  const crimeMeans=Math.floor(r()*6);
  const moved=r()<0.7;
  const bodyRoom=moved?pick(neighbors(crimeRoom),r):crimeRoom;

  const others=shuffle([0,1,2,3,4,5].filter(i=>i!==culprit),r);
  const liars=[culprit,...others.slice(0,dif.liars-1)];
  const truthful=others.slice(dif.liars-1);

  const trueRoom={}; trueRoom[culprit]=crimeRoom;
  const busy=new Set([crimeRoom]);
  const freeRoom=()=>{const f=nine.filter(x=>x!==crimeRoom&&!busy.has(x));if(!f.length)return null;
    const x=pick(f,r);busy.add(x);return x};

  for(const c of liars){ if(c===culprit)continue; const x=freeRoom(); if(x===null)return null; trueRoom[c]=x }

  /* los sinceros se agrupan y se confirman entre ellos */
  const groups=[];{const t=truthful.slice();
    while(t.length){ groups.push(t.splice(0, t.length===3?3:2)) }}
  for(const g of groups){ const x=freeRoom(); if(x===null)return null; g.forEach(c=>trueRoom[c]=x) }

  /* Lo que cada uno DICE. La coartada falsa apunta siempre a una sala que
     nadie ocupó: si señalase la sala de otro, ese otro la desmentiría gratis. */
  const claim={};
  const ocupadas=new Set(Object.values(trueRoom));
  const libres=shuffle(nine.filter(x=>!ocupadas.has(x)),r);
  let li=0;
  for(const c of liars){
    if(li<libres.length){ claim[c]=libres[li++]; }
    else { let x,k=0; do{x=Math.floor(r()*9);k++}while((x===trueRoom[c]||x===crimeRoom)&&k<50); claim[c]=x }
  }
  for(const g of groups) g.forEach(c=>claim[c]=trueRoom[c]);

  /* ---------- pistas ---------- */
  const clues=[];
  const Rm=P.rooms, Ch=P.chars, Ms=P.means;
  const srcR=i=>({t:'room',i}), srcC=i=>({t:'char',i});

  /* la escena */
  if(moved){
    clues.push(mk(`${P.cuerpo[0].toUpperCase()+P.cuerpo.slice(1)} fue arrastrado hasta aquí. Hay un reguero tenue que entra por la puerta: lo mataron en otra parte.`,
      srcR(bodyRoom),[{k:'roomNear',v:bodyRoom},{k:'roomNot',v:bodyRoom}],{hard:true}));
    clues.push(mk(`En las suelas del muerto, ${Rm[crimeRoom].mat}. Vino andando de un sitio con ese suelo — o lo trajeron desde él.`,
      srcR(bodyRoom),[{k:'roomMat',v:Rm[crimeRoom].mat}],{hard:true}));
  }else{
    clues.push(mk(`Aquí hay señales de lucha: una silla volcada, la alfombra corrida, sangre bajo ella. No lo movieron. Murió en esta sala.`,
      srcR(bodyRoom),[{k:'roomIs',v:crimeRoom}],{hard:true}));
  }
  const fq=culprit===P.forenseIdx?P.forenseAlt:P.forenseQuien;
  clues.push(mk(`${fq[0].toUpperCase()+fq.slice(1)} examina la herida: fue ${P.tagTxt[Ms[crimeMeans].t]}.`,
    srcR(bodyRoom),[{k:'meansTag',v:Ms[crimeMeans].t}],{hard:true}));

  /* descartes de medio — el hermano de tag es obligatorio */
  const sameTag=Ms.map((m,i)=>i).filter(i=>Ms[i].t===Ms[crimeMeans].t&&i!==crimeMeans);
  const dsh=shuffle(P.descarte,r);
  const freeRooms=shuffle(nine.filter(x=>x!==bodyRoom),r);
  let fr=0;
  sameTag.forEach((mi,k)=>{
    clues.push(mk(`${Ms[mi].n[0].toUpperCase()+Ms[mi].n.slice(1)} ${dsh[k%dsh.length]}. Queda fuera.`,
      srcR(freeRooms[fr++%freeRooms.length]),[{k:'meansNot',v:mi}],{hard:true}));
  });
  /* uno o dos descartes de otro tag, por textura */
  const extraElim=shuffle(Ms.map((m,i)=>i).filter(i=>Ms[i].t!==Ms[crimeMeans].t),r).slice(0,dif.id==='facil'?2:1);
  extraElim.forEach((mi,k)=>{
    clues.push(mk(`${Ms[mi].n[0].toUpperCase()+Ms[mi].n.slice(1)} ${dsh[(k+3)%dsh.length]}.`,
      srcC(pick(liars.concat(truthful),r)),[{k:'meansNot',v:mi}]));
  });

  /* la sala del crimen, cuando no es donde apareció el cuerpo, está demasiado limpia */
  if(moved){
    clues.push(mk(`Esta sala está demasiado limpia. Alguien borró aquí lo que hubiera, y con prisa: queda un cerco húmedo junto al zócalo y ni una sola huella en el polvo.`,
      srcR(crimeRoom),[{k:'roomIs',v:crimeRoom}],{hard:true}));
  }

  /* objetos personales. Redacción idéntica para todos: distinguir cuál acusa
     y cuál es señuelo es trabajo del jugador, no del formato del texto.
     El culpable no deja ninguno — a él se llega por eliminación. */
  const dejan=liars.filter(c=>c!==culprit);
  for(const c of dejan){
    clues.push(mk(`Tras un mueble, en el suelo, ${Ch[c].obj}. Es de ${Ch[c].n}.`,
      srcR(trueRoom[c]),[],{obj:c,objRoom:trueRoom[c]}));
  }
  for(const g of groups) for(const c of g){
    let x,k=0; do{x=Math.floor(r()*9);k++}while((x===trueRoom[c])&&k<30);
    clues.push(mk(`Tras un mueble, en el suelo, ${Ch[c].obj}. Es de ${Ch[c].n}.`, srcR(x),[],{obj:c,objRoom:x}));
  }

  /* coartadas mutuas de los sinceros */
  for(const g of groups){
    const nombres=g.map(c=>Ch[c].n);
    const factos=g.map(c=>({k:'atRoom',c,r:trueRoom[c]}));
    const txt=`Durante ${P.horaCrimen} estuvimos juntos en ${SALA(P,trueRoom[g[0]])}: ${nombres.join(' y ')}. No se movió nadie de allí, y cada cual responde por los demás.`;
    g.forEach(c=>clues.push(mk(txt,srcC(c),factos,{hard:true,alibi:true})));
  }

  /* secretos */
  const sec=shuffle(P.secretos,r);
  const secreto={}; liars.forEach((c,i)=>secreto[c]=sec[i%sec.length]);

  const C={P,dif,culprit,crimeRoom,crimeMeans,bodyRoom,moved,liars,truthful,groups,
           trueRoom,claim,clues,secreto,
           /* solo los mentirosos que NO son el culpable pueden quebrarse:
              al culpable se llega descartando a los otros cinco */
           careoFacts:dejan.map(c=>({k:'atRoom',c,r:trueRoom[c]}))};
  return C;
}

function ok(h,facts,P){
  for(const f of facts){
    if(f.k==='meansTag'&&P.means[h.m].t!==f.v)return false;
    if(f.k==='meansNot'&&h.m===f.v)return false;
    if(f.k==='roomIs'&&h.r!==f.v)return false;
    if(f.k==='roomNot'&&h.r===f.v)return false;
    if(f.k==='roomMat'&&P.rooms[h.r].mat!==f.v)return false;
    if(f.k==='roomNear'&&!(h.r===f.v||neighbors(f.v).includes(h.r)))return false;
    if(f.k==='atRoom'&&h.c===f.c&&h.r!==f.r)return false;
  }
  return true;
}

function solutions(C,facts){
  const out=[];
  for(let c=0;c<6;c++)for(let rr=0;rr<9;rr++)for(let m=0;m<6;m++){
    const h={c,r:rr,m}; if(ok(h,facts,C.P))out.push(h);
  }
  return out;
}

/* el caso solo es válido si TODO lo descubrible deja una única lectura */
function verify(C){
  const facts=C.clues.flatMap(x=>x.facts).concat(C.careoFacts);
  const s=solutions(C,facts);
  return s.length===1&&s[0].c===C.culprit&&s[0].r===C.crimeRoom&&s[0].m===C.crimeMeans;
}

function generateCase(packId,difId,seedStr){
  const P=PACKS[packId],dif=DIFS[difId];
  for(let a=0;a<400;a++){
    const r=mulberry32(hash(seedStr+'|'+packId+'|'+difId)+a*7919);
    const C=build(P,dif,r);
    if(C&&verify(C))return C;
  }
  return null;
}

function logCase(res){            /* 'win' | 'lose' | 'ab' */
  const win=res==='win';
  const e={t:Date.now(),seed:S.seed,pack:S.pack,dif:S.dif.id,win,ab:res==='ab',left:S.acc,fails:S.careoFails||0,mesa:S.modo==='mesa'?S.n:0};
  ST.log.unshift(e); ST.log=ST.log.slice(0,80);
  const W=ST.log.filter(x=>x.win);
  const got=id=>{if(!ST.meds[id])ST.meds[id]=Date.now()};
  if(win){
    got('first');
    if(e.dif==='dificil')got('hard');
    if(e.fails===0)got('clean');
    if(e.left>=5)got('fast');
    if(W.some(x=>x.pack==='villa')&&W.some(x=>x.pack==='casa'))got('both');
    if(ST.log.length>=3&&ST.log.slice(0,3).every(x=>x.win))got('racha');
    if(CAT.filter(c=>c.ok).every(c=>W.some(x=>x.pack===c.id)))got('ocho');
  }
  save();
}

/* ============================================================
   MODO MESA — todos con el mismo código, cada uno con su número.
   Lo que hay en cada sala se reparte entre los jugadores de forma
   calculada, no transmitida: los seis móviles llegan por su cuenta
   al mismo reparto. Nadie puede cerrar el caso solo; la mesa sí.
   Lo que hay junto al cuerpo lo ve todo el mundo: es el punto de
   partida común.
   ============================================================ */
const cuantosVen=n=>Math.max(1,Math.round(n/2));

/* los hechos que un jugador puede llegar a reunir él solo: lo que ve en las salas
   más los careos que puede romper con las pruebas que le han tocado */
function hechosDe(C,map,yo){
  const f=[],rotos=new Set();
  C.clues.forEach(c=>{
    if(c.src.t==='room'&&map[c.id]&&!map[c.id].includes(yo))return;
    f.push(...c.facts);
    if(c.obj!=null&&c.obj!==C.culprit&&C.liars.includes(c.obj)&&c.objRoom===C.trueRoom[c.obj])rotos.add(c.obj);
  });
  rotos.forEach(c=>f.push({k:'atRoom',c,r:C.trueRoom[c]}));
  return f;
}
function repartoCrudo(C,seed,n,ven,intento){
  const map={};
  C.clues.forEach(c=>{
    if(c.src.t!=='room'||c.src.i===C.bodyRoom){map[c.id]=null;return}
    const r=mulberry32(hash(seed+'|reparto|'+c.id+'|'+n+'|'+intento));
    map[c.id]=shuffle([...Array(n).keys()].map(i=>i+1),r).slice(0,ven);
  });
  return map;
}
/* Un reparto solo vale si NADIE puede cerrar el caso por su cuenta — si no,
   el que tenga suerte gana callado y se acabó el juego — y si nadie se queda
   sin nada que aportar. Se prueban repartos hasta dar con uno que cumpla:
   como todo sale de la semilla, los ocho móviles eligen el mismo. */
function repartoVale(C,map,n){
  for(let yo=1;yo<=n;yo++){
    const propias=C.clues.filter(c=>c.src.t==='room'&&c.src.i!==C.bodyRoom&&map[c.id].includes(yo)).length;
    if(!propias)return false;
    if(solutions(C,hechosDe(C,map,yo)).length===1)return false;
  }
  return true;
}
function reparto(C,seed,n){
  const nc=C.clues.filter(c=>c.src.t==='room'&&c.src.i!==C.bodyRoom).length;
  /* cuántos ojos por pista: menos y alguien se queda sin nada; más y alguien resuelve solo.
     Se prueba el reparto ideal y se va abriendo a los dos lados. */
  const ideal=cuantosVen(n), suelo=Math.max(1,Math.ceil(n/Math.max(1,nc)));
  const orden=[];
  for(let d=0;d<n;d++){
    const a=ideal-d,b=ideal+d;
    if(a>=suelo&&a<n&&!orden.includes(a))orden.push(a);
    if(d&&b>=suelo&&b<n&&!orden.includes(b))orden.push(b);
  }
  if(!orden.length)orden.push(Math.min(Math.max(suelo,1),Math.max(1,n-1)));
  let mejor=null,mejorMal=1e9;
  for(const ven of orden)for(let a=0;a<25;a++){
    const map=repartoCrudo(C,seed,n,ven,a);
    if(repartoVale(C,map,n))return map;
    const mal=fallosReparto(C,map,n);
    if(mal<mejorMal){mejorMal=mal;mejor=map}
  }
  /* ninguno limpio: se coge el menos malo y se repara a mano */
  return repara(C,mejor||repartoCrudo(C,seed,n,1,999),n,seed);
}
/* Reparación dirigida: al que pueda cerrar el caso solo se le quita una pista con
   sustancia y se le pasa a otro; al que se quede sin nada se le da una. */
function repara(C,map,n,seed){
  const r=mulberry32(hash(seed+'|repara|'+n));
  const jug=[...Array(n).keys()].map(i=>i+1);
  const sueltas=C.clues.filter(c=>c.src.t==='room'&&c.src.i!==C.bodyRoom);
  const pega=(arr)=>arr[Math.floor(r()*arr.length)];
  for(let paso=0;paso<60;paso++){
    const solo=jug.find(yo=>solutions(C,hechosDe(C,map,yo)).length===1);
    if(solo===undefined)break;
    const cand=sueltas.filter(c=>map[c.id].includes(solo)&&(c.facts.length||c.obj!=null)&&map[c.id].length>1);
    const cand2=cand.length?cand:sueltas.filter(c=>map[c.id].includes(solo)&&(c.facts.length||c.obj!=null));
    if(!cand2.length)break;
    const c=pega(cand2), otros=jug.filter(x=>!map[c.id].includes(x));
    if(!otros.length)break;
    map[c.id]=map[c.id].filter(x=>x!==solo);
    if(!map[c.id].includes(otros[0]))map[c.id].push(pega(otros));
  }
  for(let paso=0;paso<30;paso++){
    const vacio=jug.find(yo=>!sueltas.some(c=>map[c.id].includes(yo)));
    if(vacio===undefined)break;
    const cand=sueltas.filter(c=>!map[c.id].includes(vacio));
    if(!cand.length)break;
    const c=pega(cand); map[c.id]=map[c.id].concat(vacio);
    if(solutions(C,hechosDe(C,map,vacio)).length===1)map[c.id]=map[c.id].filter(x=>x!==vacio);
  }
  return map;
}
/* cuenta cuántos jugadores rompen las dos condiciones, para quedarse con el menos malo */
function fallosReparto(C,map,n){
  let mal=0;
  for(let yo=1;yo<=n;yo++){
    const propias=C.clues.filter(c=>c.src.t==='room'&&c.src.i!==C.bodyRoom&&map[c.id].includes(yo)).length;
    if(!propias)mal+=2;                                             /* sin nada que aportar: lo peor */
    if(solutions(C,hechosDe(C,map,yo)).length===1)mal+=3;           /* puede ganar sin hablar: aún peor */
  }
  return mal;
}

function randSeed(){const A='BCDFGHJKLMNPRSTVXZ',V='AEIOU';let s='';
  for(let i=0;i<6;i++)s+=(i%2?V:A)[Math.floor(Math.random()*(i%2?V.length:A.length))];return s}

/* ¿esta pista es mía? en solitario, todas */
const mia=c=>S.modo!=='mesa'||!S.rep[c.id]||S.rep[c.id].includes(S.yo);

function newGame(packId,difId,seed,modo,n,yo){
  const C=generateCase(packId,difId,seed);
  if(!C){sheetMsg('CÓDIGO ESTÉRIL','Ese código no cuaja en un caso resoluble. Prueba con otro.');return}
  modo=modo||'solo';
  S={C,seed,pack:packId,dif:DIFS[difId],acc:DIFS[difId].acc,rooms:new Set(),chars:new Set(),
     careo:{},careoFails:0,found:new Set(),tab:'plano',over:null,seenClues:0,
     modo,n:n||1,yo:yo||1,notas:[],fuera:false,rep:{}};
  if(modo==='mesa')S.rep=reparto(C,seed,S.n);
  document.body.dataset.pack=packId; TAB='jugar';
  render(); escena();
}
function escena(){
  const P=S.C.P; let i=S.modo==='mesa'?-1:0;
  const paso=()=>{
    if(i===-1){
      openSheetRaw('JUGADOR '+S.yo+' DE '+S.n,
       `<p style="font-family:var(--serif);font-size:19px;line-height:1.55">Sois <b>${S.n}</b> sobre el mismo caso. En cada sala solo verás <b>una parte</b> de lo que hay: el resto lo encontrarán los demás.</p>
        <p style="font-family:var(--serif);font-size:19px;line-height:1.55;margin-top:12px;color:var(--dim)">Lo que está junto al cuerpo lo veis todos. Lo demás hay que pedirlo — o cambiarlo, o inventarlo.</p>
        <button class="btn primary" id="nx">ENTENDIDO</button>`);
      $('nx').onclick=()=>{i=0;paso()}; return;
    }
    if(i>=P.escena.length){closeSheet();render();return}
    const ult=i===P.escena.length-1;
    openSheetRaw(i===0?P.corto:'',
      `<p style="font-family:var(--serif);font-size:20px;line-height:1.55">${P.escena[i]}</p>
       <button class="btn ${ult?'primary':''}" id="nx">${ult?'EMPEZAR':'···'}</button>`);
    $('nx').onclick=()=>{i++;paso()};
  };
  paso();
}
function spend(n){S.acc=Math.max(0,S.acc-n)}
const facts=()=>{const f=[];
  S.C.clues.forEach(c=>{if(S.found.has(c.id))f.push(...c.facts)});
  Object.keys(S.careo).forEach(c=>{if(S.careo[c]==='ok')f.push({k:'atRoom',c:+c,r:S.C.trueRoom[c]})});
  /* lo que te han contado cuenta igual que lo que has visto — y la app no lo comprueba */
  (S.notas||[]).forEach(nt=>{if(nt.fio)f.push(nt.hecho)});
  return f};
const foundClues=()=>S.C.clues.filter(c=>S.found.has(c.id));

function render(){
  if(enCaso())renderCaso(); else renderLobby();

function renderNav(){
  const T=enCaso()
   ? [['gente',IC.gente,'GENTE'],['plano',IC.plano,'PLANO',1],['cuaderno',IC.nota,'CUADERNO']]
   : [['archivo',IC.archivo,'ARCHIVO'],['jugar',IC.lupa,'JUGAR',1],['club',IC.club,'CLUB']];
  const cur=enCaso()?S.tab:TAB;
  const nuevas=enCaso()&&S.seenClues<S.found.size;
  nav.innerHTML=T.map(([k,ic,lab,hub])=>{
    const on=cur===k?'on':'';
    const svg=`<svg viewBox="0 0 24 24">${ic}</svg>`;
    return hub
      ? `<button class="hub ${on}" data-tab="${k}"><span class="disc">${svg}</span>${lab}</button>`
      : `<button class="${on}" data-tab="${k}">${svg}${lab}${k==='cuaderno'&&nuevas?'<span class="dot"></span>':''}</button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.tab;
    if(enCaso()){S.tab=k; if(k==='cuaderno')S.seenClues=S.found.size}
    else{ /* desde el desenlace, cualquier pestaña devuelve al club: el caso ya está en el archivo */
      if(S&&S.over){S=null;sel={c:null,r:null,m:null}}
      TAB=k; }
    render();
  });
}
function topbar(){
  const R=$('topR'),L=$('topL');
  if(enCaso()){
    $('topTtl').textContent=S.C.P.corto;
    L.innerHTML='<button class="iconbtn" id="salir">‹</button>';
    $('salir').onclick=()=>confirmSalir();
    R.innerHTML=S.fuera
      ? `<div class="pill low"><b>FUERA</b></div>`
      : `<div class="pill act" id="goAcc">⚖ ACUSAR</div>
         <div class="pill ${S.acc<=3?'low':''}"><b>${S.acc}</b></div>`;

    $('topTtl').textContent='HUNT CLUB';

    R.innerHTML=`<div class="pill">${rank().n}</div>`;

}

function renderSetup(){
  document.body.dataset.pack=setup.pack;
  const mesa=setup.modo==='mesa';
  if(mesa&&setup.dif==='facil')setup.dif='normal';
  let h=`<h2 class="sec">CÓMO JUGÁIS</h2>
   <div class="chips" style="margin-bottom:${mesa?'10px':'20px'}">
     <div class="chip ${mesa?'':'on'}" data-m="solo"><div class="cn">En solitario</div><span class="cs">tú contra el caso</span></div>
     <div class="chip ${mesa?'on':''}" data-m="mesa"><div class="cn">En mesa</div><span class="cs">cada uno con su móvil</span></div>
   </div>`;
  if(mesa){
    h+=`<div class="card" style="margin-bottom:20px">
      <div class="rl" style="margin-bottom:9px">CUÁNTOS SOIS</div>
      <div class="nums">${[2,3,4,5,6,7,8].map(x=>`<div class="num ${setup.n===x?'on':''}" data-n="${x}">${x}</div>`).join('')}</div>
      <div class="rl" style="margin:15px 0 9px">TU NÚMERO</div>
      <div class="nums">${Array.from({length:setup.n},(_,i)=>i+1).map(x=>`<div class="num ${setup.yo===x?'on':''}" data-y="${x}">${x}</div>`).join('')}</div>
      <div class="note" style="text-align:left;margin-top:13px">Repartíos los números sin repetir. Cada uno verá una parte distinta de lo que hay en las salas.${
        setup.n>=7?' <b style="color:var(--accent2)">Con '+setup.n+' tocáis a muy poco cada uno</b>: se juega bien, pero hay que pedir mucho. Entre 3 y 5 es donde mejor está.':''}</div>
    </div>`;
  }
  h+=`<h2 class="sec">ELIGE LA NOCHE</h2>`;
  CAT.forEach(a=>{
    const on=setup.pack===a.id?'on':'';
    h+=`<div class="scard ${a.ok?on:'soon'}" ${a.ok?`data-a="${a.id}"`:''}>
      <img class="scene" src="${FOTO.amb[a.id]}" alt="">
      <div class="scrim"></div>
      ${a.ok?'<div class="mark">✓</div>':'<div class="soonbadge">PRÓXIMAMENTE</div>'}
      <div class="lab"><div class="n">${a.n}</div><div class="s">${a.s}</div></div></div>`;
  });
  h+=`<h2 class="sec" style="margin-top:20px">DIFICULTAD</h2><div class="chips">`;
  /* En mesa, "Indicios claros" no vale: con solo dos mentirosos casi todo es público
     y a alguien le puede tocar la pista que cierra el caso él solo, callado. */
  Object.values(DIFS).filter(d=>!(mesa&&d.id==='facil')).forEach(d=>{
    h+=`<div class="chip ${setup.dif===d.id?'on':''}" data-d="${d.id}">
      <div class="cn">${d.n}</div><span class="cs">${d.desc.replace(' · ','<br>')}</span></div>`});
  h+=`</div>${mesa?'<div class="note" style="text-align:left;margin-top:8px">En mesa hace falta gente que mienta: con la dificultad más suave casi todo sería público y alguien podría cerrar el caso sin hablar con nadie.</div>':''}<h2 class="sec" style="margin-top:20px">CÓDIGO DEL CASO</h2>
    <div class="seedrow">
      <input class="code" id="seed" maxlength="18" value="${setup.seed||randSeed()}" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="reroll" id="rr">⟳</button>
    </div>
    <div class="note" style="margin-bottom:10px">${mesa
      ?'Este código tiene que ser <b>el mismo en los '+setup.n+' móviles</b>, y también el ambiente y la dificultad. Lo que cambia es tu número.'
      :'El código genera el caso entero. Pásaselo a alguien y jugaréis exactamente el mismo, cada uno en su móvil.'}</div>
    <button class="btn primary" id="start">${mesa?'EMPEZAR · JUGADOR '+setup.yo:'EMPEZAR LA NOCHE'}</button>`;
  screen.innerHTML=h;
  /* el código se limpia según se escribe: así el límite cuenta caracteres útiles,
     no espacios ni signos que luego se van a tirar */
  const limpia=v=>v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10);
  const keep=()=>{const i=$('seed');const v=limpia(i.value);if(v!==i.value)i.value=v;setup.seed=v};
  screen.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>{keep();setup.pack=el.dataset.a;renderSetup()});
  screen.querySelectorAll('[data-d]').forEach(el=>el.onclick=()=>{keep();setup.dif=el.dataset.d;renderSetup()});
  screen.querySelectorAll('[data-m]').forEach(el=>el.onclick=()=>{keep();setup.modo=el.dataset.m;renderSetup()});
  screen.querySelectorAll('[data-n]').forEach(el=>el.onclick=()=>{keep();setup.n=+el.dataset.n;

  screen.querySelectorAll('[data-y]').forEach(el=>el.onclick=()=>{keep();setup.yo=+el.dataset.y;renderSetup()});
  $('seed').oninput=keep;
  $('rr').onclick=()=>{setup.seed=randSeed();renderSetup()};
  $('start').onclick=()=>{
    const s=limpia($('seed').value||'')||randSeed();
    setup.seed=''; sel={c:null,r:null,m:null};
    newGame(setup.pack,setup.dif,s,setup.modo,setup.n,setup.yo);
  };
}

      <div class="src">${e.ab?'CASO ABANDONADO':(e.win?'CASO CERRADO':'CASO PERDIDO')}</div>
      <div class="txt">${e.ab
        ?'Lo dejaste a medias. El código sigue vivo: esta noche te espera igual que la dejaste.'
        :(e.win
        ?`Acertaste los tres, con ${e.left} ${e.left===1?'acción':'acciones'} de sobra${e.fails?` y ${e.fails} ${e.fails===1?'careo fallido':'careos fallidos'}`:' y sin fallar un careo'}.`
        :'Acusaste a quien no era. El código sigue siendo el mismo si quieres la revancha.')}</div></div>

   CASO

function renderCaso(){
  topbar();
  if(S.tab==='plano')renderPlan();
  else if(S.tab==='gente')renderPeople();
  else renderNotes();
}

function renderPlan(){
  const C=S.C,P=C.P,foto=FOTO.tab[S.pack];
  let g='';
  for(let i=0;i<9;i++){
    const cls=['rm',S.rooms.has(i)?'done':'',i===C.bodyRoom?'body':''].filter(Boolean).join(' ');
    g+=`<div class="${cls}" data-room="${i}">
      <div class="fx" style="background-image:url(${foto});background-position:${(i%3)*50}% ${Math.floor(i/3)*50}%"></div>
      ${i===C.bodyRoom?'<div class="mk">✕</div>':''}
      ${S.rooms.has(i)?'<div class="ck">✓</div>':''}
      <div class="lab"><div class="ln">${P.rooms[i].n}</div><div class="lm">${P.rooms[i].mat}</div></div>
    </div>`;
  }
  const dl=P.lugar.startsWith('el ')?'DEL '+P.lugar.slice(3):'DE '+P.lugar;
  screen.innerHTML=`<h2 class="sec">EL PLANO ${dl.toUpperCase()}</h2>
    <p class="lead" style="margin-bottom:10px">${P.victima.n} apareció muert${P.victima.g==='f'?'a':'o'} en <b style="color:var(--ink)">${SALA(P,C.bodyRoom)}</b> durante ${P.horaCrimen}.</p>
    <div id="plan">${g}</div>
    <div class="note">${9-S.rooms.size} salas sin registrar · cada registro cuesta 1 acción</div>`;
  screen.querySelectorAll('.rm').forEach(el=>el.onclick=()=>inspect(+el.dataset.room));
}
function inspect(i){
  if(S.rooms.has(i)){showRoom(i,false);return}
  if(S.fuera){sheetMsg('ESTÁS FUERA','Ya no investigas. Pero tu cuaderno sigue ahí, y la mesa sigue hablando.');return}
  if(S.acc<1){sheetMsg('SIN TIEMPO','No queda noche. Solo puedes acusar.');return}
  S.rooms.add(i); spend(1);
  S.C.clues.filter(c=>c.src.t==='room'&&c.src.i===i&&mia(c)).forEach(c=>S.found.add(c.id));
  showRoom(i,true); render();
}
function showRoom(i,fresh){
  const P=S.C.P, todas=S.C.clues.filter(c=>c.src.t==='room'&&c.src.i===i);
  const cs=todas.filter(mia), ajenas=todas.length-cs.length;
  const d=P.rooms[i].d[0].toUpperCase()+P.rooms[i].d.slice(1);
  const body=cs.length?cs.map(c=>`<div class="clue ${c.obj!=null?'obj':(c.hard?'hard':'')}"><div class="txt">${c.txt}</div></div>`).join('')
    :`<div class="clue"><div class="txt" style="color:var(--dim)">Nada. ${d} está tal y como se dejó. Una acción gastada.</div></div>`;
  const aviso=ajenas?`<div class="clue" style="border-left-color:color-mix(in srgb,var(--accent) 60%,transparent)">
      <div class="txt" style="color:var(--accent2)">Aquí hay ${ajenas===1?'algo más que ha encontrado otro':'más cosas que han encontrado otros'} y que tú no has visto. Pregunta.</div></div>`:'';
  openSheet(P.rooms[i].n.toUpperCase(),
    `<p style="color:var(--dim);font-size:14px;margin-bottom:14px">${d} · suelo de ${P.rooms[i].mat}</p>${body}${aviso}`,
    fresh?'SEGUIR':'CERRAR');
}

function renderPeople(){
  const P=S.C.P;
  screen.innerHTML=`<h2 class="sec">LOS QUE ESTABAN EN ${P.lugar.toUpperCase()}</h2>
    <p class="lead">Interrogar cuesta 1 acción. Carear cuesta otra, y solo se quiebra si le pones delante una pieza suya hallada donde jura no haber estado. Quien no puedas descartar al final es tu culpable.</p>`
    +P.chars.map((_,i)=>personCard(i)).join('');
  screen.querySelectorAll('[data-per]').forEach(el=>el.onclick=()=>openPerson(+el.dataset.per));
}
function personCard(i){
  const C=S.C,P=C.P,ch=P.chars[i],inter=S.chars.has(i),st=S.careo[i];
  const cleared=facts().some(f=>f.k==='atRoom'&&f.c===i&&f.r!==C.crimeRoom);
  let tags='';
  if(!inter)tags+='<span class="tag">sin interrogar</span>';
  if(st==='ok')tags+='<span class="tag lie">confesó su secreto</span>';
  if(st==='fail')tags+='<span class="tag">se cierra en banda</span>';
  if(cleared)tags+='<span class="tag cleared">fuera de sospecha</span>';
  else if(inter)tags+='<span class="tag open">sin confirmar</span>';
  return `<div class="card tap" data-per="${i}">
    <div class="row"><div class="av">${ch.ini}</div>
      <div style="min-width:0"><div class="nm">${ch.n}</div><div class="rl">${ch.r}</div></div></div>
    ${inter?`<div class="claim">«Durante ${P.horaCrimen} estuve en ${SALA(P,C.claim[i])}.»</div>`:''}
    <div>${tags}</div></div>`;
}
function openPerson(i){
  const C=S.C,P=C.P,ch=P.chars[i],inter=S.chars.has(i);
  let body=`<div class="row" style="margin-bottom:14px"><div class="av">${ch.ini}</div>
    <div><div class="nm">${ch.n}</div><div class="rl">${ch.r}</div></div></div>`;
  if(inter){
    body+=`<div class="claim">«Durante ${P.horaCrimen} estuve en ${SALA(P,C.claim[i])}.»</div>`;
    C.clues.filter(c=>c.src.t==='char'&&c.src.i===i&&S.found.has(c.id))
      .forEach(c=>body+=`<div class="clue ${c.hard?'hard':''}" style="margin-top:14px"><div class="txt">${c.txt}</div></div>`);
    if(S.careo[i]==='ok')
      body+=`<div class="clue obj" style="margin-top:14px"><div class="src">CONFESIÓN</div><div class="txt">Estuvo en <b>${SALA(P,C.trueRoom[i])}</b>. ${cap(C.secreto[i])}.</div></div>`;
  }else body+=`<p style="font-family:var(--serif);font-size:17px;color:var(--dim)">Aún no has hablado con ${ch.n.split(' ')[0]}.</p>`;
  const b=[];
  if(!inter)b.push('<button class="btn primary" data-a="int">INTERROGAR · 1</button>');
  else if(S.careo[i]!=='ok')b.push('<button class="btn" data-a="careo">CAREAR · 1</button>');
  b.push('<button class="btn ghost" data-a="x">CERRAR</button>');
  openSheetRaw(ch.n.toUpperCase(),body+b.join(''));
  sheet.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>{
    const a=el.dataset.a;
    if(a==='x'){closeSheet();render()}
    else if(a==='int')interrogate(i);
    else careoPicker(i);
  });
}
const cap=s=>s[0].toUpperCase()+s.slice(1);
function interrogate(i){
  if(S.fuera){sheetMsg('ESTÁS FUERA','Ya no investigas. Pero tu cuaderno sigue ahí, y la mesa sigue hablando.');return}
  if(S.acc<1){sheetMsg('SIN TIEMPO','No queda noche. Solo puedes acusar.');return}
  S.chars.add(i); spend(1);
  S.C.clues.filter(c=>c.src.t==='char'&&c.src.i===i).forEach(c=>S.found.add(c.id));
  openPerson(i); topbar(); renderNav();
}
function careoPicker(i){
  const P=S.C.P, objs=foundClues().filter(c=>c.obj!=null);
  if(!objs.length){sheetMsg('NADA QUE PONERLE DELANTE','Un careo sin pruebas es una conversación. Registra salas hasta encontrar algo que contradiga a alguien.');return}
  let body=`<p style="font-family:var(--serif);font-size:17px;color:var(--dim);margin-bottom:14px">Elige la pieza que desmonta su versión. Si te equivocas, se cierra y pierdes la acción igual.</p>`;
  objs.forEach(c=>body+=`<div class="card tap" data-c="${c.id}">
    <div style="font-family:var(--serif);font-size:16px">${c.txt}</div>
    <div class="rl" style="margin-top:6px">Hallado en ${SALA(P,c.objRoom)}</div></div>`);
  body+='<button class="btn ghost" data-a="x">VOLVER</button>';
  openSheetRaw('CAREO CON '+P.chars[i].n.toUpperCase(),body);
  sheet.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>doCareo(i,+el.dataset.c));
  sheet.querySelector('[data-a]').onclick=()=>openPerson(i);
}
function doCareo(i,clueId){
  if(S.fuera){sheetMsg('ESTÁS FUERA','Ya no investigas.');return}
  if(S.acc<1){sheetMsg('SIN TIEMPO','No queda noche. Solo puedes acusar.');return}
  const C=S.C,P=C.P,r=mulberry32(hash(S.seed+'|'+i+'|'+clueId))();
  const cl=C.clues.find(c=>c.id===clueId);
  spend(1);
  if(C.liars.includes(i)&&cl.obj===i&&cl.objRoom===C.trueRoom[i]){
    S.careo[i]='ok';
    openSheet('SE QUIEBRA',
      `<div class="clue obj"><div class="src">${P.chars[i].n}</div>
        <div class="txt" style="font-style:italic">«${P.confesion[Math.floor(r*P.confesion.length)]}»</div></div>
       <p style="font-family:var(--serif);font-size:17px;margin-top:14px">Admite que durante ${P.horaCrimen} estuvo en <b>${SALA(P,C.trueRoom[i])}</b>. ${cap(C.secreto[i])}.</p>`,'SEGUIR');
  }else{
    if(S.careo[i]!=='ok')S.careo[i]='fail';
    S.careoFails++;
    openSheet('AGUANTA',
      `<div class="clue"><div class="src">${P.chars[i].n}</div>
        <div class="txt" style="font-style:italic">«${P.negacion[Math.floor(r*P.negacion.length)]}»</div></div>
       <p class="note" style="margin-top:14px;text-align:left">Acción gastada. Puedes volver a intentarlo con otra pieza.</p>`,'SEGUIR');
  }
  topbar(); renderNav();
}

function renderNotes(){
  const C=S.C,P=C.P,cs=foundClues(),pos=solutions(C,facts());
  const u=k=>[...new Set(pos.map(h=>h[k]))].length;
  let h=`<h2 class="sec">CUADERNO</h2>
   <div class="stat3">
     <div class="stat"><b>${u('c')}</b><span>CULPABLES</span></div>
     <div class="stat"><b>${u('r')}</b><span>SALAS</span></div>
     <div class="stat"><b>${u('m')}</b><span>MEDIOS</span></div></div>`;
  if(!cs.length)h+=`<div class="empty"><div class="ei">✎</div><div class="et">El cuaderno está en blanco.<br>Empieza por ${SALA(P,C.bodyRoom)}: donde está el cuerpo siempre hay algo.</div></div>`;
  else{
    const byR=cs.filter(c=>c.src.t==='room'), byC=cs.filter(c=>c.src.t==='char');
    if(byR.length){h+='<h2 class="sec" style="margin-top:18px">HALLAZGOS</h2>';
      byR.forEach(c=>h+=`<div class="clue ${c.obj!=null?'obj':(c.hard?'hard':'')}"><div class="src">${P.rooms[c.src.i].n}</div><div class="txt">${c.txt}</div></div>`)}
    if(byC.length){h+='<h2 class="sec" style="margin-top:18px">TESTIMONIOS</h2>';
      byC.forEach(c=>h+=`<div class="clue ${c.hard?'hard':''}"><div class="src">${P.chars[c.src.i].n}</div><div class="txt">${c.txt}</div></div>`)}
    const cf=Object.keys(S.careo).filter(k=>S.careo[k]==='ok');
    if(cf.length){h+='<h2 class="sec" style="margin-top:18px">CONFESIONES</h2>';
      cf.forEach(k=>h+=`<div class="clue obj"><div class="src">${P.chars[k].n}</div><div class="txt">Estuvo en ${SALA(P,C.trueRoom[k])}. ${cap(C.secreto[k])}.</div></div>`)}
  }
  if(S.modo==='mesa'){
    h+='<h2 class="sec" style="margin-top:20px">LO QUE ME HAN CONTADO</h2>';
    if(!S.notas.length)
      h+=`<p class="lead">Nada todavía. Lo que te cuenten los demás se apunta aquí y cuenta en tu deducción igual que lo que has visto con tus ojos — <b style="color:var(--ink)">aunque sea mentira</b>.</p>`;
    else S.notas.forEach((nt,k)=>{
      h+=`<div class="clue ${nt.fio?'hard':''}" style="opacity:${nt.fio?1:.5}">
        <div class="src">${nt.quien} · ${nt.fio?'me fío':'dudoso'}</div>
        <div class="txt">${nt.txt}</div>
        <div style="display:flex;gap:7px;margin-top:8px">
          <button class="minibtn" data-fio="${k}">${nt.fio?'MARCAR DUDOSO':'VOLVER A FIARME'}</button>
          <button class="minibtn" data-del="${k}">BORRAR</button></div></div>`});
    h+=`<button class="btn" id="anotar">ANOTAR LO QUE ME HAN CONTADO</button>`;
    if(S.fuera)h+=`<button class="btn ghost" id="destapar">VER LA SOLUCIÓN</button>`;
  }
  screen.innerHTML=h; S.seenClues=S.found.size;
  if(S.modo==='mesa'){
    $('anotar').onclick=()=>notaPaso1();
    if(S.fuera)$('destapar').onclick=()=>{
      openSheet('¿HA TERMINADO LA MESA?',
       `<p style="font-family:var(--serif);font-size:17.5px;line-height:1.5">Si lo destapas ahora y queda alguien en pie, le estropeas la partida. Espera a que alguien cierre el caso.</p>
        <button class="btn primary" id="sipues">SÍ, DESTÁPALO</button>`,'ESPERAR');
      $('sipues').onclick=()=>{S.over='lose';closeSheet();TAB='jugar';render()};
    };
    screen.querySelectorAll('[data-fio]').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.fio; S.notas[k].fio=!S.notas[k].fio; render()});
    screen.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      S.notas.splice(+b.dataset.del,1); render()});
  }
}

/* ---------- anotar lo que te dicen ----------
   La app NO comprueba nada: si te han mentido, tu contador miente contigo.
   Por eso cada nota lleva quién te la dio y se puede marcar como dudosa. */
let nota={tipo:null,a:null,b:null,quien:null};
function notaPaso1(){
  nota={tipo:null,a:null,b:null,quien:null};
  openSheetRaw('¿QUÉ TE HAN DICHO?',
   `<p style="font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--dim);margin-bottom:14px">Apunta lo que te han contado. Entrará en tu deducción como una pista más, y nadie va a comprobar si es verdad.</p>
    <div class="opt" data-t="donde" style="margin-bottom:8px">Alguien estuvo en una sala<small>«Fulano estuvo en la Cocina»</small></div>
    <div class="opt" data-t="arma" style="margin-bottom:8px">Un arma queda descartada<small>«la daga está limpia»</small></div>
    <div class="opt" data-t="sala" style="margin-bottom:8px">El crimen fue en una sala<small>«lo mataron en la Bodega»</small></div>
    <button class="btn ghost" id="x">VOLVER</button>`);
  sheet.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{nota.tipo=el.dataset.t;notaPaso2()});
  $('x').onclick=()=>{closeSheet();render()};
}
function notaPaso2(){
  const P=S.C.P;
  if(nota.tipo==='donde'&&nota.a===null){
    openSheetRaw('¿DE QUIÉN HABLAN?',
      `<div class="grid">${P.chars.map((c,i)=>`<div class="opt" data-i="${i}">${c.n}<small>${c.r}</small></div>`).join('')}</div>
       <button class="btn ghost" id="x">VOLVER</button>`);
    sheet.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{nota.a=+el.dataset.i;notaPaso2()});
    $('x').onclick=()=>notaPaso1(); return;
  }
  if(nota.tipo==='arma'){
    openSheetRaw('¿QUÉ ARMA DESCARTAN?',
      `<div class="grid">${P.means.map((m,i)=>`<div class="opt" data-i="${i}">${m.n}</div>`).join('')}</div>
       <button class="btn ghost" id="x">VOLVER</button>`);
    sheet.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{nota.b=+el.dataset.i;notaPaso3()});
    $('x').onclick=()=>notaPaso1(); return;
  }
  const ttl=nota.tipo==='sala'?'¿DÓNDE DICEN QUE FUE?':'¿EN QUÉ SALA DICEN QUE ESTUVO?';
  openSheetRaw(ttl,
    `<div class="grid">${P.rooms.map((r,i)=>`<div class="opt" data-i="${i}">${r.n}<small>${r.d}</small></div>`).join('')}</div>
     <button class="btn ghost" id="x">VOLVER</button>`);
  sheet.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{nota.b=+el.dataset.i;notaPaso3()});
  $('x').onclick=()=>{if(nota.tipo==='donde'){nota.a=null;notaPaso2()}else notaPaso1()};
}
function notaPaso3(){
  const otros=Array.from({length:S.n},(_,i)=>i+1).filter(x=>x!==S.yo);
  openSheetRaw('¿QUIÉN TE LO HA DICHO?',
   `<div class="nums" style="margin-bottom:12px">${otros.map(x=>`<div class="num" data-q="${x}">${x}</div>`).join('')}</div>
    <div class="note" style="text-align:left">Queda apuntado con su número. Si luego resulta que te la jugó, puedes marcar la nota como dudosa y ver qué queda sin ella.</div>
    <button class="btn ghost" id="x">VOLVER</button>`);
  sheet.querySelectorAll('[data-q]').forEach(el=>el.onclick=()=>{nota.quien=+el.dataset.q;guardaNota()});
  $('x').onclick=()=>notaPaso2();
}
function guardaNota(){
  const P=S.C.P; let hecho,txt;
  if(nota.tipo==='donde'){hecho={k:'atRoom',c:nota.a,r:nota.b};
    txt=`${P.chars[nota.a].n} estuvo en ${SALA(P,nota.b)} durante ${P.horaCrimen}.`}
  else if(nota.tipo==='arma'){hecho={k:'meansNot',v:nota.b};
    txt=`${cap(P.means[nota.b].n)} queda descartada como arma.`}
  else{hecho={k:'roomIs',v:nota.b};
    txt=`El crimen fue en ${SALA(P,nota.b)}.`}
  S.notas.push({hecho,txt,quien:'Jugador '+nota.quien,fio:true});
  S.tab='cuaderno'; closeSheet(); render();
}

/* ---------- abandonar el caso ---------- */
function confirmSalir(){
  const virgen=S.acc===S.dif.acc;   /* no ha gastado nada: fue equivocarse de puerta */
  openSheetRaw('DEJARLO AQUÍ',
   `<p style="font-family:var(--serif);font-size:17.5px;line-height:1.55;color:var(--dim)">${
     virgen ? 'Aún no has movido ficha, así que esto no deja rastro: vuelves a elegir noche y ya está.'
            : `Perderás lo investigado. El caso quedará en el archivo como abandonado, y el código <b style="color:var(--accent2)">${S.seed}</b> te devuelve exactamente esta misma noche cuando quieras.`
   }</p>
    <button class="btn primary" id="si">ELEGIR OTRA NOCHE</button>
    <button class="btn ghost" id="no">SEGUIR AQUÍ</button>`);
  $('no').onclick=()=>{closeSheet();render()};
  $('si').onclick=()=>{
    if(!virgen)logCase('ab');
    setup.pack=S.pack; setup.dif=S.dif.id; setup.seed=S.seed;
    S=null; sel={c:null,r:null,m:null}; TAB='jugar';
    closeSheet(); render();
  };
}

/* ---------- acusación, en hoja ---------- */
function openAccuse(){
  const P=S.C.P;
  const g=(arr,k,lab)=>`<h2 class="sec" style="margin-top:16px">${lab}</h2><div class="grid">`+
    arr.map((x,i)=>`<div class="opt ${sel[k]===i?'on':''}" data-k="${k}" data-i="${i}">${x.a}${x.b?`<small>${x.b}</small>`:''}</div>`).join('')+'</div>';
  const listo=sel.c!=null&&sel.r!=null&&sel.m!=null;
  openSheetRaw('LA ACUSACIÓN',
    `<p style="font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--dim)">Una sola. Si aciertas los tres, el caso se cierra. Si fallas en uno, te equivocaste de persona y ya no hay vuelta.</p>
     ${g(P.chars.map(c=>({a:c.n,b:c.r})),'c','QUIÉN')}
     ${g(P.rooms.map(r=>({a:r.n,b:r.d})),'r','DÓNDE')}
     ${g(P.means.map(m=>({a:m.n})),'m','CON QUÉ')}
     <button class="btn primary" id="go" ${listo?'':'disabled'}>ACUSAR</button>
     <button class="btn ghost" id="bk">SEGUIR INVESTIGANDO</button>`);
  sheet.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    const t=sheet.scrollTop; sel[o.dataset.k]=+o.dataset.i; openAccuse(); sheet.scrollTop=t});
  $('bk').onclick=()=>{closeSheet();render()};
  if(listo)$('go').onclick=()=>confirmAccuse();
}
function confirmAccuse(){
  const C=S.C,P=C.P;
  openSheet('¿SEGURO?',
   `<p style="font-family:var(--serif);font-size:18px;line-height:1.5">Acusas a <b>${P.chars[sel.c].n}</b> de matar a ${P.victima.n} en <b>${P.rooms[sel.r].n}</b> con <b>${P.means[sel.m].n}</b>.</p>
    <p class="note" style="text-align:left;margin-top:12px">No hay segunda oportunidad.</p>
    <button class="btn primary" id="yes">LO SOSTENGO</button>`,'VOLVER');
  $('yes').onclick=()=>{
    const win=sel.c===C.culprit&&sel.r===C.crimeRoom&&sel.m===C.crimeMeans;
    if(!win&&S.modo==='mesa'){
      /* en mesa nadie destapa el caso al fallar: te quedas sentado, sin acciones
         y sin nada que perder, que es cuando mentir sale gratis */
      S.fuera=true; S.acc=0; logCase('lose');
      openSheet('ESTÁS FUERA',
       `<p style="font-family:var(--serif);font-size:18px;line-height:1.5">Te equivocaste. Ya no puedes investigar ni volver a acusar.</p>
        <p style="font-family:var(--serif);font-size:18px;line-height:1.5;margin-top:12px;color:var(--dim)">Pero sigues en la mesa, conservas tu cuaderno y nadie sabe lo que tienes. Habla. Enseña lo que quieras. Enseña lo que no es.</p>`,'SEGUIR EN LA MESA');
      return;
    }
    S.over=win?'win':'lose'; logCase(S.over); closeSheet(); TAB='jugar'; render();
  };
}

function renderEnd(){
  const C=S.C,P=C.P,win=S.over==='win';
  let h=`<div class="hero"><div class="verdict ${win?'win':'lose'}">${win?'CASO CERRADO':'CASO PERDIDO'}</div>
    <div class="sub">${win?'Acertaste los tres.':'Acusaste a quien no era.'}</div></div><div class="rule"></div>
    <p class="lead"><b style="color:var(--ink)">${P.chars[C.culprit].n}</b> mató a ${P.victima.n} en <b style="color:var(--ink)">${SALA(P,C.crimeRoom)}</b> con <b style="color:var(--ink)">${P.means[C.crimeMeans].n}</b>${C.moved?`, y arrastró el cuerpo hasta ${SALA(P,C.bodyRoom)}.`:'.'}</p>
    <h2 class="sec">LO QUE ESCONDÍA CADA UNO</h2>`;
  P.chars.forEach((ch,i)=>{
    const cul=i===C.culprit, mie=C.liars.includes(i);
    h+=`<div class="card"><div class="row"><div class="av">${ch.ini}</div>
      <div><div class="nm">${ch.n}</div><div class="rl">${ch.r}</div></div></div>
      <div class="claim">Dijo: ${P.rooms[C.claim[i]].n} · Estuvo: ${P.rooms[C.trueRoom[i]].n}</div>
      <div style="font-family:var(--serif);font-size:16px;margin-top:10px;color:${cul?'var(--accent)':'var(--dim)'}">
      ${cul?'Fue quien lo hizo.':(mie?cap(C.secreto[i])+'. Por eso mintió.':'Dijo la verdad desde el principio.')}</div></div>`});
  h+=`<div class="rule"></div><div class="code">${S.seed}</div>
    <div class="note" style="margin-top:6px">Este era el código del caso. Quien lo introduzca juega exactamente el mismo.</div>
    <button class="btn primary" id="again">OTRO CASO</button>
    <button class="btn ghost" id="menu">VOLVER AL CLUB</button>`;
  screen.innerHTML=h;
  $('again').onclick=()=>{const p=S.pack,d=S.dif.id;S=null;sel={c:null,r:null,m:null};newGame(p,d,randSeed())};
  $('menu').onclick=()=>{S=null;sel={c:null,r:null,m:null};TAB='jugar';render()};
}

/* ---------- hoja ---------- */
function openSheetRaw(t,h){sheet.innerHTML=(t?`<h3>${t}</h3>`:'')+h;modal.classList.add('on')}
function openSheet(t,h,b){
  openSheetRaw(t,h+`<button class="btn primary" id="sheetOk">${b||'CERRAR'}</button>`);
  $('sheetOk').onclick=()=>{closeSheet();render()};
}
function sheetMsg(t,m){openSheet(t,`<p style="font-family:var(--serif);font-size:17px;line-height:1.5">${m}</p>`)}
function closeSheet(){modal.classList.remove('on');sheet.innerHTML=''}
modal.querySelector('.bd').onclick=()=>{closeSheet();render()};

/* ---------- gestos: nada de zoom ni rebote ---------- */
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault(),{passive:false}));
let lastT=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastT<300)e.preventDefault();lastT=n},{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});

/* ---------- arranque ---------- */
render();
setTimeout(()=>$('splash').classList.add('out'),1450);
setTimeout(()=>{const s=$('splash');if(s)s.remove()},2100);
</script>
</body>
</html>
